services:
  postgres:
    image: postgres:16-alpine
    container_name: quadro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quadro_operacional}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quadro-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quadro_operacional}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      SAIDA_VEICULOS_MOCK: ${SAIDA_VEICULOS_MOCK:-true}
      SAIDA_VEICULOS_URL: ${SAIDA_VEICULOS_URL:-}
      SAIDA_VEICULOS_SYNC_INTERVAL_MS: ${SAIDA_VEICULOS_SYNC_INTERVAL_MS:-60000}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quadro-frontend
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
