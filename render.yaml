# Backend para frontend na Vercel
# Blueprint: New → Blueprint → conectar repo
# Se já tiver Postgres no Render (free = 1 banco), preencha DATABASE_URL manualmente no dashboard.
services:
  - type: web
    name: quadro-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: FRONTEND_URL
        sync: false
      - key: SAIDA_VEICULOS_MOCK
        value: "true"
