# Backend + PostgreSQL para usar com frontend na Vercel
# Deploy: https://render.com → New → Blueprint → conectar repo
services:
  - type: web
    name: quadro-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quadro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: FRONTEND_URL
        sync: false
      - key: SAIDA_VEICULOS_MOCK
        value: "true"

databases:
  - name: quadro-db
    plan: free
    databaseName: quadro_operacional
    user: quadro
